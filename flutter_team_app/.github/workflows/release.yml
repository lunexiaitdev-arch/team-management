name: Build & Release FBIBD Team APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21 (Required by AGP 8.11+)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: Verify Environment
        run: |
          java -version
          flutter doctor -v

      - name: Install Dependencies
        run: flutter pub get

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Production APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Prepare APK Asset
        run: |
          mkdir -p build/app/outputs/flutter-apk/
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/FBIBD_Team.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: FBIBD Team ${{ github.ref_name }}
          files: |
            build/app/outputs/flutter-apk/FBIBD_Team.apk
            build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
